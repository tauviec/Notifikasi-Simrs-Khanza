db.host=localhost
db.port=3306
db.database=rscnd
db.username=root
db.password=
jenis.watch=lab,radiologi
poll.interval.seconds=15

# Khusus notifikasi Farmasi (resep_obat): unit asal resep yang mau dipantau.
# Isi ralan saja (Rawat Jalan), ranap saja (Rawat Inap), atau gabungan ralan,ranap (default).
farmasi.unit=ralan,ranap

# Khusus untuk resep Ralan (Rawat Jalan) di Farmasi: saring lagi per nama poliklinik asal.
# Kosongkan untuk semua poliklinik Ralan. Nama harus persis sama dengan nm_poli di Khanza
# (case-insensitive), pisah koma kalau lebih dari satu, mis. farmasi.ralan.poli=IGD,Poli Anak
farmasi.ralan.poli=IGD
alarm.sound.file=alarm.mp3

# Berapa kali suara alarm diputar ULANG setiap kali alarm dibunyikan (bukan soal berapa
# menit sekali diingatkan -- itu di alarm.repeat.minutes di bawah). Isi 1 kalau cuma mau
# sekali putar saja tanpa berulang.
alarm.sound.repeat=2

# Alarm bunyi ulang tiap berapa menit selama permintaan MASIH belum dilayani.
# Isi 0 untuk mematikan pengulangan (alarm cuma bunyi sekali saat permintaan pertama kali muncul).
alarm.repeat.minutes=1

# Selain alarm bunyi, jendela daftar permintaan juga otomatis muncul ke layar.
# Isi false kalau cuma mau alarm+balloon notifikasi saja (jendela tidak otomatis muncul).
popup.auto=true
